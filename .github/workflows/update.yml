name: Update Russian domain list

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-russia-domains
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run quality checks
        run: |
          black --check .
          ruff check .
          pytest
          python tools/generate_checksums.py --check

      - name: Regenerate domain list
        run: |
          python update.py
          python tools/generate_checksums.py

      - name: Validate generated list
        run: python validate.py output/russia-domains.txt

      - name: Upload generated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbr-russia-${{ github.run_id }}
          path: |
            openwrt/install.sh
            openwrt/update.sh
            output/russia-domains.txt
            output/statistics.json
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository for publishing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pbr-russia-${{ github.run_id }}
          path: .

      - name: Commit updated outputs
        id: commit
        shell: bash
        run: |
          git add output/russia-domains.txt output/statistics.json output/SHA256SUMS
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Russian domain list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(date -u +'%Y.%m.%d')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag="$tag.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          assets=(
            openwrt/install.sh
            openwrt/update.sh
            output/russia-domains.txt
            output/statistics.json
            output/SHA256SUMS
          )
          git tag -a "$tag" -m "Russian domain list $tag"
          git push origin "$tag"
          gh release create "$tag" "${assets[@]}" \
            --title "Russian domain list $tag" \
            --notes "Automated weekly integrity-checked release."
