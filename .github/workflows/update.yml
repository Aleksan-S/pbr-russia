name: Update Russian domain list

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-russia-domains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run quality checks
        run: |
          black --check .
          ruff check .
          pytest

      - name: Regenerate domain list
        run: python update.py

      - name: Commit updated list
        shell: bash
        run: |
          git add output/russia-domains.txt
          if git diff --cached --quiet; then
            echo "Domain list is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Russian domain list"
          git push
